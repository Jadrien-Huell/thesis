<!DOCTYPE html>
<html>
<head>
<title>Player Card with Description</title>
<style>
  .player-card {
    width: 250px;
    border: 1px solid #ddd;
    border-radius: 8px;
    overflow: hidden;
    box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
    font-family: sans-serif;
    cursor: pointer; /* Indicate it's clickable */
    position: relative; /* For absolute positioning of description */
  }

  .player-card img {
    width: 100%;
    height: auto;
    display: block;
  }

  .player-card-content {
    padding: 16px;
    text-align: center;
  }

  .player-card-name {
    font-size: 1.2em;
    font-weight: bold;
    margin-bottom: 8px;
  }

  .player-card-description {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background-color: rgba(255, 255, 255, 0.9);
    padding: 20px;
    box-sizing: border-box;
    display: none; /* Hidden by default */
    text-align: left;
  }

  .player-card-description.show {
    display: block; /* Show when 'show' class is added */
  }

  .player-card-description button {
    position: absolute;
    top: 10px;
    right: 10px;
    background: none;
    border: none;
    font-size: 1.2em;
    cursor: pointer;
  }
</style>
</head>
<body>

<div class="player-card" onclick="toggleDescription(this)">
  <img src="player-image.jpg" alt="Player Picture">
  <div class="player-card-content">
    <div class="player-card-name">John Doe</div>
  </div>
  <div class="player-card-description">
    <button onclick="closeDescription(event, this.parentElement)">×</button>
    <p><strong>Position:</strong> Forward</p>
    <p><strong>Team:</strong> Example Team</p>
    <p><strong>Number:</strong> 10</p>
    <p>John Doe is a skilled forward known for his scoring ability and versatility on the court. He has been a key player for Example Team for several seasons.</p>
  </div>
</div>

<script>
  function toggleDescription(card) {
    const description = card.querySelector('.player-card-description');
    description.classList.toggle('show');
  }

  function closeDescription(event, description) {
    event.stopPropagation(); // Prevent card click from re-opening
    description.classList.remove('show');
  }
</script>

</body>
</html>
