<!DOCTYPE html>
<html>
<head>
<title>Player Card</title>
<style>
  .player-card {
    width: 250px;
    border: 1px solid #ddd;
    border-radius: 8px;
    overflow: hidden;
    box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
    font-family: sans-serif;
  }

  .player-card img {
    width: 100%;
    height: auto;
    display: block;
  }

  .player-card-content {
    padding: 16px;
    text-align: center;
  }

  .player-card-name {
    font-size: 1.2em;
    font-weight: bold;
    margin-bottom: 8px;
  }

  .player-card-details {
    font-size: 0.9em;
    color: #555;
  }

  /* Example details styling (optional) */
  .player-card-details p {
    margin: 4px 0;
  }
</style>
</head>
<body>

<div class="player-card">
  <!-- <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSp3F-1Pbmy-uVfPmBS9-Can-gqFSpsSCf8vg&s" alt="Player Picture"> -->
  <img src="https://cdn.pixabay.com/photo/2015/10/05/22/37/blank-profile-picture-973460_1280.png" alt="blank-profile-picture-973460_1280">
  <div class="player-card-content">
    <div class="player-card-name">Jane Doe</div>
    <div class="player-card-details">
      <p>Position: Forward</p>
      <p>Team: Example Team</p>
      <p>Number: 10</p>
    </div>
  </div>
</div>

</body>
</html>
